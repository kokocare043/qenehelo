<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QENEHELO Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Segoe UI,sans-serif;
background:#0d0d0d;
color:white;
padding:20px;
}

.container{
max-width:600px;
margin:auto;
}

.header{
background:#161616;
padding:25px;
border-radius:15px;
text-align:center;
box-shadow:0 0 20px rgba(255,215,0,0.15);
}

.header h1{
color:gold;
margin-bottom:5px;
}

.card{
background:#161616;
padding:20px;
border-radius:15px;
margin-top:20px;
box-shadow:0 0 20px rgba(255,215,0,0.1);
}

.card h2{
color:gold;
margin-bottom:15px;
font-size:20px;
}

.stat{
font-size:35px;
font-weight:bold;
color:gold;
margin-top:10px;
}

.referral-box{
background:#000;
padding:15px;
border-radius:10px;
border:1px solid gold;
font-size:20px;
text-align:center;
margin-top:10px;
word-break:break-all;
}

button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
font-size:15px;
transition:0.3s;
}

.copy-btn{
background:#007bff;
color:white;
}

.share-btn{
background:#25D366;
color:white;
}

.logout-btn{
background:#ff4444;
color:white;
}

.friend{
background:#222;
padding:12px;
border-radius:8px;
margin-top:10px;
}

.empty{
color:#999;
margin-top:10px;
}

.small{
font-size:14px;
color:#aaa;
margin-top:5px;
}

.order{
background:#222;
padding:12px;
border-radius:8px;
margin-top:10px;
}

</style>


<style id="qenehelo-brand-theme">
:root{--q-black:#090909;--q-gold:#c9a34a;--q-cream:#f7f2e8;--q-ink:#211b12}
html{scroll-behavior:smooth}body{font-family:Georgia,'Times New Roman',serif!important;background:var(--q-cream)!important;color:var(--q-ink)}
header{background:linear-gradient(110deg,#050505,#211a0c)!important;border-bottom:2px solid var(--q-gold);box-shadow:0 8px 28px #0002}
header h1,header h2{color:#f4d58b;letter-spacing:1.5px}nav a{transition:color .2s}nav a:hover,footer a:hover{color:#f4d58b!important}
button,.link-btn,.buy-button,.pay-btn,header button{background:linear-gradient(135deg,#f0d58e,#b88a2e)!important;color:#100d07!important;border:1px solid #e4c474!important;border-radius:3px!important;font-weight:700;letter-spacing:.2px}
.card,details,.container,.payment-box,#giftBox{border:1px solid #dfc98f!important;box-shadow:0 12px 30px #33240f12!important}
footer{background:#080808!important;color:#eee!important;border-top:2px solid var(--q-gold)}footer a{color:#e2c276!important}
input,select,textarea{border:1px solid #d2bd8c!important;border-radius:3px!important}
.brand-mark{display:flex;align-items:center;justify-content:center;gap:13px;color:#f2d48b}.brand-mark>span{font-family:Georgia,serif;font-size:58px;line-height:1;border:2px solid #c9a34a;border-radius:50%;width:68px;height:68px;display:grid;place-items:center}.brand-mark div{display:flex;flex-direction:column;text-align:left}.brand-mark strong{font-size:clamp(25px,5vw,40px);letter-spacing:5px}.brand-mark small{font:10px Arial,sans-serif;letter-spacing:2px;color:#e0c27a}
@media(max-width:600px){.brand-mark>span{width:52px;height:52px;font-size:43px}.brand-mark strong{letter-spacing:2px}.brand-mark small{font-size:8px}}
</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>QENEHELO</h1>

<p>Customer Dashboard</p>

</div>

<!-- PROFILE -->

<div class="card">

<h2>My Profile</h2>

<p><b>Name:</b> <span id="name"></span></p>

<p><b>Email:</b> <span id="email"></span></p>

<p><b>Phone:</b> <span id="phone"></span></p>

<p><b>Joined:</b> <span id="joined"></span></p>

</div>

<!-- REFERRAL -->

<div class="card">

<h2>My Referral Code</h2>

<div class="referral-box" id="referralCode"></div>

<button class="copy-btn" onclick="copyReferral()">
Copy Referral Code
</button>

<button class="share-btn" onclick="shareReferral()">
Share On WhatsApp
</button>

</div>

<!-- STATS -->

<div class="card">

<h2>Referral Statistics</h2>

<p>Total Referrals</p>

<div class="stat" id="refCount">0</div>

<p class="small">
Earn R50 per successful referral
</p>

</div>

<!-- REWARDS -->

<div class="card">

<h2>Rewards Balance</h2>

<div class="stat">
R<span id="rewards">0</span>
</div>

</div>

<!-- FRIENDS -->

<div class="card">

<h2>Friends Referred</h2>

<div id="friendsList"></div>

</div>

<!-- ORDERS -->

<div class="card">

<h2>My Orders</h2>

<div id="ordersList"></div>

</div>

<button class="logout-btn" onclick="logout()">
Logout
</button>

</div>

<script>

const USERS_KEY="thubalesha_users";

const SESSION_KEY="thubalesha_session";

const ORDERS_KEY="thubalesha_orders";

// SESSION

const session=
JSON.parse(
localStorage.getItem(SESSION_KEY)
);

// CHECK LOGIN

if(!session){

window.location.href="login.html";

}

// USERS

let users=
JSON.parse(
localStorage.getItem(USERS_KEY)||"[]"
);

// FIND USER

let currentUser=
users.find(
u=>u.email===session.email
);

// LOAD PROFILE

document.getElementById("name")
.innerText=currentUser.name;

document.getElementById("email")
.innerText=currentUser.email;

document.getElementById("phone")
.innerText=currentUser.contact;

document.getElementById("joined")
.innerText=currentUser.joined;

document.getElementById("referralCode")
.innerText=currentUser.referral;

// REFERRALS

document.getElementById("refCount")
.innerText=currentUser.friends.length;

document.getElementById("rewards")
.innerText=currentUser.rewards;

// FRIENDS

let friendsHTML="";

if(currentUser.friends.length===0){

friendsHTML=
`<p class="empty">
No referrals yet
</p>`;

}else{

currentUser.friends.forEach(friend=>{

friendsHTML+=`

<div class="friend">

${friend}

</div>

`;

});

}

document.getElementById("friendsList")
.innerHTML=friendsHTML;

// ORDERS

let orders=
JSON.parse(
localStorage.getItem(ORDERS_KEY)||"[]"
);

let myOrders=
orders.filter(
o=>o.email===currentUser.email
);

let orderHTML="";

if(myOrders.length===0){

orderHTML=
`<p class="empty">
No orders yet
</p>`;

}else{

myOrders.forEach(order=>{

orderHTML+=`

<div class="order">

<b>${order.product}</b>

<br><br>

Amount: R${order.total}

<br>

Status: Pending

<br>

Date: ${order.date}

</div>

`;

});

}

document.getElementById("ordersList")
.innerHTML=orderHTML;

// COPY

function copyReferral(){

navigator.clipboard.writeText(
currentUser.referral
);

alert("Referral code copied");

}

// SHARE

function shareReferral(){

let text=

`Join QENEHELO and use my referral code:

${currentUser.referral}

Website:
https://qenehelo.gt.tc`;

window.open(

"https://wa.me/?text="+
encodeURIComponent(text)

);

}

// LOGOUT

function logout(){

localStorage.removeItem(
SESSION_KEY
);

window.location.href="login.html";

}

</script>

</body>
</html>
