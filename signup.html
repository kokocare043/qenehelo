<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QENEHELO Referral System</title>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Segoe UI,sans-serif;
background:#0d0d0d;
color:white;
padding:20px;
}

.container{
max-width:500px;
margin:auto;
background:#161616;
padding:25px;
border-radius:15px;
box-shadow:0 0 25px rgba(255,215,0,0.2);
}

h1,h2{
text-align:center;
color:gold;
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
margin:8px 0;
border:none;
border-radius:8px;
background:#222;
color:white;
font-size:15px;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
font-size:15px;
transition:0.3s;
}

.main-btn{
background:gold;
color:black;
}

.main-btn:hover{
background:#ffd700;
}

.share-btn{
background:#25D366;
color:white;
}

.copy-btn{
background:#007bff;
color:white;
}

.logout-btn{
background:#ff4444;
color:white;
}

.card{
background:#222;
padding:15px;
border-radius:10px;
margin-top:15px;
}

.stat{
font-size:28px;
font-weight:bold;
color:gold;
}

.ref-box{
background:#000;
padding:12px;
border-radius:8px;
margin-top:10px;
font-size:18px;
text-align:center;
border:1px solid gold;
}

.friend{
padding:10px;
background:#111;
border-radius:8px;
margin-top:8px;
}

.success{
background:#0f5132;
padding:12px;
border-radius:8px;
margin-top:15px;
text-align:center;
}

.error{
background:#842029;
padding:12px;
border-radius:8px;
margin-top:15px;
text-align:center;
}

.small{
font-size:14px;
color:#aaa;
margin-top:5px;
}

</style>


<style id="qenehelo-brand-theme">
:root{--q-black:#090909;--q-gold:#c9a34a;--q-cream:#f7f2e8;--q-ink:#211b12}
html{scroll-behavior:smooth}body{font-family:Georgia,'Times New Roman',serif!important;background:var(--q-cream)!important;color:var(--q-ink)}
header{background:linear-gradient(110deg,#050505,#211a0c)!important;border-bottom:2px solid var(--q-gold);box-shadow:0 8px 28px #0002}
header h1,header h2{color:#f4d58b;letter-spacing:1.5px}nav a{transition:color .2s}nav a:hover,footer a:hover{color:#f4d58b!important}
button,.link-btn,.buy-button,.pay-btn,header button{background:linear-gradient(135deg,#f0d58e,#b88a2e)!important;color:#100d07!important;border:1px solid #e4c474!important;border-radius:3px!important;font-weight:700;letter-spacing:.2px}
.card,details,.container,.payment-box,#giftBox{border:1px solid #dfc98f!important;box-shadow:0 12px 30px #33240f12!important}
footer{background:#080808!important;color:#eee!important;border-top:2px solid var(--q-gold)}footer a{color:#e2c276!important}
input,select,textarea{border:1px solid #d2bd8c!important;border-radius:3px!important}
.brand-mark{display:flex;align-items:center;justify-content:center;gap:13px;color:#f2d48b}.brand-mark>span{font-family:Georgia,serif;font-size:58px;line-height:1;border:2px solid #c9a34a;border-radius:50%;width:68px;height:68px;display:grid;place-items:center}.brand-mark div{display:flex;flex-direction:column;text-align:left}.brand-mark strong{font-size:clamp(25px,5vw,40px);letter-spacing:5px}.brand-mark small{font:10px Arial,sans-serif;letter-spacing:2px;color:#e0c27a}
@media(max-width:600px){.brand-mark>span{width:52px;height:52px;font-size:43px}.brand-mark strong{letter-spacing:2px}.brand-mark small{font-size:8px}}
</style>

</head>

<body>

<!-- SIGNUP -->

<div class="container" id="signupBox">

<h1>QENEHELO</h1>

<h2>Create Account</h2>

<form id="signupForm">

<input type="text" id="name" placeholder="Full Name" required>

<input type="text" id="idnumber" placeholder="ID Number" required>

<input type="text" id="contact" placeholder="Phone Number" required>

<input type="email" id="email" placeholder="Email Address" required>

<input type="text" id="address" placeholder="Home Address" required>

<input type="text" id="referred" placeholder="Referral Code Optional">

<button type="submit" class="main-btn">
Create Account
</button>

</form>

<div id="msg"></div>

</div>

<!-- DASHBOARD -->

<div class="container" id="dashboardBox" style="display:none;">

<h1>QENEHELO</h1>

<h2>My Dashboard</h2>

<div class="card">

<p>Welcome Back</p>

<h3 id="dashName"></h3>

<p class="small" id="dashEmail"></p>

</div>

<div class="card">

<p>My Referral Code</p>

<div class="ref-box" id="dashReferral"></div>

<button class="copy-btn" onclick="copyReferral()">
Copy Referral Code
</button>

<button class="share-btn" onclick="shareReferral()">
Share On WhatsApp
</button>

</div>

<div class="card">

<p>Total Referrals</p>

<div class="stat" id="dashCount">0</div>

</div>

<div class="card">

<p>Estimated Rewards</p>

<div class="stat">
R<span id="dashRewards">0</span>
</div>

<p class="small">
Earn R50 per successful referral
</p>

</div>

<div class="card">

<h3>Friends Referred</h3>

<div id="friendsList"></div>

</div>

<button class="logout-btn" onclick="logout()">
Logout
</button>

</div>

<script>

// EMAILJS

(function(){

emailjs.init("0PazREzQtkxaCNEKN");

})();

const USERS_KEY="thubalesha_users";

const SESSION_KEY="thubalesha_session";

// GENERATE REFERRAL

function generateReferral(){

const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

let code="THUBA-";

for(let i=0;i<6;i++){

code+=chars.charAt(Math.floor(Math.random()*chars.length));

}

return code;

}

// USERS

function getUsers(){

return JSON.parse(
localStorage.getItem(USERS_KEY)||"[]"
);

}

function saveUsers(users){

localStorage.setItem(
USERS_KEY,
JSON.stringify(users)
);

}

// SESSION

function saveSession(user){

localStorage.setItem(
SESSION_KEY,
JSON.stringify(user)
);

}

function getSession(){

return JSON.parse(
localStorage.getItem(SESSION_KEY)
);

}

// SIGNUP

document.getElementById("signupForm")
.addEventListener("submit",function(e){

e.preventDefault();

let users=getUsers();

let name=document.getElementById("name").value;

let idnumber=document.getElementById("idnumber").value;

let contact=document.getElementById("contact").value;

let email=document.getElementById("email").value;

let address=document.getElementById("address").value;

let referred=document.getElementById("referred").value.trim();

let referral=generateReferral();

// CHECK EXISTING EMAIL

let existing=users.find(u=>u.email===email);

if(existing){

document.getElementById("msg").innerHTML=
`<div class="error">
Email already registered
</div>`;

return;

}

// CREATE USER

let newUser={

name,
idnumber,
contact,
email,
address,
referral,
referred,
friends:[],
rewards:0,
joined:new Date().toLocaleDateString()

};

// ADD REFERRAL

if(referred){

let refUser=users.find(
u=>u.referral===referred
);

if(refUser){

refUser.friends.push(name);

refUser.rewards += 50;

}

}

users.push(newUser);

saveUsers(users);

saveSession(newUser);

// EMAILJS

emailjs.send(
"service_z1c4gpi",
"template_5tupw7g",
{

name:name,
id:idnumber,
contact:contact,
email:email,
address:address,
referred:referred,
referral:referral

}

);

// SUCCESS

document.getElementById("msg").innerHTML=

`<div class="success">

Account Created Successfully

</div>`;

// DASHBOARD

setTimeout(()=>{

showDashboard(newUser);

},1000);

});

// DASHBOARD

function showDashboard(user){

document.getElementById("signupBox")
.style.display="none";

document.getElementById("dashboardBox")
.style.display="block";

let users=getUsers();
o
let myData=users.find(
u=>u.referral===user.referral
);

document.getElementById("dashName")
.innerText=myData.name;

document.getElementById("dashEmail")
.innerText=myData.email;

document.getElementById("dashReferral")
.innerText=myData.referral;

document.getElementById("dashCount")
.innerText=myData.friends.length;

document.getElementById("dashRewards")
.innerText=myData.rewards;

// FRIENDS LIST

let html="";

if(myData.friends.length===0){

html="<p>No referrals yet</p>";

}else{

myData.friends.forEach(friend=>{

html+=`
<div class="friend">
${friend}
</div>
`;

});

}

document.getElementById("friendsList")
.innerHTML=html;

}

// COPY

function copyReferral(){

let code=
document.getElementById("dashReferral")
.innerText;

navigator.clipboard.writeText(code);

alert("Referral Code Copied");

}

// SHARE

function shareReferral(){

let code=
document.getElementById("dashReferral")
.innerText;

let text=
`Join QENEHELO using my referral code: ${code}`;

window.open(
"https://wa.me/?text="+
encodeURIComponent(text)
);

}

// LOGOUT

function logout(){

localStorage.removeItem(SESSION_KEY);

location.reload();

}

// AUTO LOGIN

window.onload=function(){

let session=getSession();

if(session){

showDashboard(session);

}

}

</script>

</body>
</html
